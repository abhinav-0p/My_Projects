<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-toe</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <div class="msg-box hide">
        <p id="text">The winner</p>
        <button id="new-game">New game</button>
        
    </div>
    <div id="main_container">
        
        <h1>Tic-Tac-Toe</h1>
        <div class="game">
            <button class="bt" id="box0"></button>
            <button class="bt" id="box1"></button>
            <button class="bt" id="box2"></button>
            <button class="bt" id="box3"></button>
            <button class="bt" id="box4"></button>
            <button class="bt" id="box5"></button>
            <button class="bt" id="box6"></button>
            <button class="bt" id="box7"></button>
            <button class="bt" id="box8"></button>
        </div>
        <button id="reset">Reset</button>
        
    </div>
    <script src="game.js"></script>
 </body>
</html>
