<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main_display">
        <p class="display"></p>
    </div>
    <div class="allbutton">
        <button class="buttons" id="allclear" onclick="allclear()">AC</button>
        <button class="buttons" id="clear" onclick="lastclear()">C</button>
        <button class="buttons" id="no.9" onclick="appendvalue('.')">.</button>

        <button class="buttons" id="no.9" onclick="appendvalue('9')">9</button>
        <button class="buttons" id="no.8" onclick="appendvalue('8')">8</button>
        <button class="buttons" id="add" onclick="appendvalue('+')">+</button>

        <button class="buttons" id="no.7" onclick="appendvalue('7')">7</button>
        <button class="buttons" id="no.6" onclick="appendvalue('6')">6</button>
        <button class="buttons" id="subtract" onclick="appendvalue('-')">-</button>

        <button class="buttons" id="no.5" onclick="appendvalue('5')">5</button>
        <button class="buttons" id="no.4" onclick="appendvalue('4')">4</button>
        <button class="buttons" id="multiply" onclick="appendvalue('*')">*</button>

        <button class="buttons" id="no.3" onclick="appendvalue('3')">3</button>
        <button class="buttons" id="no.2" onclick="appendvalue('2')">2</button>
        <button class="buttons" id="division" onclick="appendvalue('/')">/</button>

        <button class="buttons" id="no.1" onclick="appendvalue('1')">1</button>
        <button class="buttons" id="no.0" onclick="appendvalue('0')">0</button>
        <button class="buttons" id="=" onclick="calculate()">=</button>

    </div>


    <script src="script.js"></script>
</body>
</html>
