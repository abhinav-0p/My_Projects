<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="containor">
        <h1>Rock-Paper-Scissor</h1>

        <div class="circle" >
            <button id="rock"></button>
            <button id="paper"></button>
            <button id="scissor"></button>
        </div>
        <div><p id="comppara">Computer choose</p></div>
        <div class="computerchoice showpaper">
        </div>

        <div class="score"><p id="score-p">Scoreboard</p>
            ---------------
            <p id="playerscore">Player : 0</p>
            <p id="compscore">Computer : 0</p>
            <p id="drawscore">Draw : 0</p>
        </div>

        <div class="msg-box"><p id="move"> Pick your move </p></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
